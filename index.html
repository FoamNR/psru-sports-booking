<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองสนามกีฬาสำหรับนักศึกษา - มรภ.พิบูลสงคราม</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        psruGreen: '#01a715',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Common JS Layout & Auth Controller -->
    <script src="js/layout.js"></script>
</head>
<body class="bg-white text-gray-800 min-h-screen flex flex-col">

    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Announcements Banner if exists -->
    <div id="announcement-banner" class="hidden bg-gradient-to-r from-green-500 to-emerald-600 text-white py-3 px-4 shadow-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between text-xs sm:text-sm">
            <div class="flex items-center space-x-2">
                <i data-lucide="megaphone" class="w-4 h-4 flex-shrink-0 animate-bounce"></i>
                <span class="font-bold">[ประกาศด่วน]: </span>
                <span id="announcement-text"></span>
            </div>
            <button onclick="document.getElementById('announcement-banner').remove()" class="text-white hover:text-gray-200">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- 2. HERO & SEARCH SECTION -->
    <header class="bg-white pt-10 pb-8 border-b border-gray-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center md:text-left">
            <div class="inline-flex items-center space-x-2 bg-green-50 text-psruGreen px-3 py-1 rounded-full text-xs font-semibold mb-3">
                <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
                <span>บริการสวัสดิการนักศึกษา ไม่มีค่าใช้จ่าย</span>
            </div>
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900 tracking-tight">
                จอง <span class="text-psruGreen">สนามกีฬา มรภ.พิบูลสงคราม</span>
            </h1>
            <p class="mt-2 text-gray-500 text-sm max-w-xl">
                เลือกสนามที่ต้องการและระบุเวลาที่เข้าใช้งานด้วยรหัสนักศึกษา สามารถจองล่วงหน้าได้สูงสุด 3 วัน
            </p>

            <!-- Search Form Dashboard -->
            <div class="mt-8 bg-white rounded-2xl border border-gray-200 shadow-sm p-4 md:p-6 max-w-5xl">
                <form id="search-form" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <!-- Input 1: Keyword -->
                    <div class="relative">
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">ชื่อสนาม / ประเภทกีฬา</label>
                        <div class="relative">
                            <i data-lucide="search" class="absolute left-3 top-3 w-5 h-5 text-gray-400"></i>
                            <input type="text" id="search-input" placeholder="เช่น ฟุตซอล, แบดมินตัน..." 
                                class="w-full bg-gray-50 pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-psruGreen focus:bg-white text-sm transition-all">
                        </div>
                    </div>
                    
                    <!-- Input 2: Date Selector -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">วันที่ต้องการเข้าใช้งาน</label>
                        <div class="relative">
                            <i data-lucide="calendar" class="absolute left-3 top-3 w-5 h-5 text-gray-400"></i>
                            <select id="filter-date" class="w-full bg-gray-50 pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-psruGreen focus:bg-white text-sm transition-all appearance-none">
                                <!-- JS Dynamic Date Options -->
                            </select>
                        </div>
                    </div>

                    <!-- Input 3: Campus / Zone -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">ศูนย์การศึกษา</label>
                        <div class="relative">
                            <i data-lucide="map-pin" class="absolute left-3 top-3 w-5 h-5 text-gray-400"></i>
                            <select id="filter-campus" class="w-full bg-gray-50 pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-psruGreen focus:bg-white text-sm transition-all appearance-none">
                                <option value="all">ทั้งหมด (ทะเลแก้ว / วังจันทน์)</option>
                                <option value="1">ศูนย์ทะเลแก้ว</option>
                                <option value="2">ศูนย์ส่วนวังจันทน์</option>
                            </select>
                        </div>
                    </div>

                    <!-- Button Submit -->
                    <div class="flex items-end">
                        <button type="submit" class="w-full bg-psruGreen hover:bg-green-700 text-white font-medium py-2.5 px-6 rounded-xl transition-all shadow-sm shadow-green-200 flex items-center justify-center space-x-2 text-sm">
                            <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
                            <span>ตรวจสอบสถานะสนาม</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </header>

    <!-- 3. MAIN CONTENT: STADIUM GRID -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-gray-900 flex items-center space-x-2">
                <span class="w-1.5 h-6 bg-psruGreen rounded-full inline-block"></span>
                <span id="grid-title">ตารางสนามกีฬา</span>
            </h2>
            <span id="results-count" class="text-sm text-gray-500 font-medium">กำลังโหลดข้อมูลสนาม...</span>
        </div>

        <!-- Grid Container -->
        <div id="courts-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Dynamic Cards Load here -->
        </div>

        <!-- No Results Safe State -->
        <div id="no-results" class="hidden text-center py-16 border border-dashed border-gray-200 rounded-2xl mt-6">
            <i data-lucide="alert-circle" class="w-12 h-12 text-gray-300 mx-auto mb-3"></i>
            <p class="text-gray-500 font-medium">ไม่พบประเภทกีฬาหรือสนามที่คุณระบุ ลองเปลี่ยนคำค้นหาดูใหม่นะ</p>
        </div>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <script>
        // Check student role authentication
        checkAuth('student');

        // Dynamic Date Generation (Today + 2 Days)
        const generateBookingDates = () => {
            const select = document.getElementById('filter-date');
            const dayNames = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
            const monthNames = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            
            for (let i = 0; i < 3; i++) {
                const targetDate = new Date();
                targetDate.setDate(targetDate.getDate() + i);
                
                let label = '';
                if (i === 0) label = `วันนี้ (วัน${dayNames[targetDate.getDay()]})`;
                else if (i === 1) label = `พรุ่งนี้ (วัน${dayNames[targetDate.getDay()]})`;
                else label = `วัน${dayNames[targetDate.getDay()]}ที่ ${targetDate.getDate()} ${monthNames[targetDate.getMonth()]}`;
                
                const value = targetDate.toISOString().split('T')[0];
                const opt = document.createElement('option');
                opt.value = value;
                opt.innerText = label;
                select.appendChild(opt);
            }
        };

        generateBookingDates();

        // API Fetch and rendering
        let globalCourts = [];

        async function fetchCourts() {
            try {
                const response = await fetch('api/courts/list.php');
                const result = await response.json();
                
                if (result.success) {
                    globalCourts = result.courts;
                    
                    // Show announcement banner if available
                    if (result.announcement) {
                        document.getElementById('announcement-banner').classList.remove('hidden');
                        document.getElementById('announcement-text').innerHTML = `<strong>${result.announcement.title}</strong> - ${result.announcement.content}`;
                    }
                    
                    renderCourts(globalCourts);
                }
            } catch (e) {
                console.error('Failed to load courts API', e);
            }
        }

        function renderCourts(courts) {
            const grid = document.getElementById('courts-grid');
            const countLabel = document.getElementById('results-count');
            
            grid.innerHTML = '';
            countLabel.textContent = `พบทั้งหมด ${courts.length} สนาม`;
            
            if (courts.length === 0) {
                document.getElementById('no-results').classList.remove('hidden');
                return;
            } else {
                document.getElementById('no-results').classList.add('hidden');
            }
            
            courts.forEach(court => {
                let status_text = 'ว่างวันนี้';
                let badge_class = 'bg-green-50 text-psruGreen border-green-100';
                let btn_text = 'จองสิทธิ์ฟรี';
                let btn_class = 'bg-psruGreen hover:bg-green-700 text-white';
                let btn_disabled = '';
                
                if (court.status === 'maintenance') {
                    status_text = 'ปรับปรุงชั่วคราว';
                    badge_class = 'bg-amber-50 text-amber-600 border-amber-100';
                    btn_text = 'งดใช้บริการ';
                    btn_class = 'bg-gray-100 text-gray-400 cursor-not-allowed';
                    btn_disabled = 'disabled';
                } else if (court.status === 'closed') {
                    status_text = 'ปิดบริการ';
                    badge_class = 'bg-red-50 text-red-600 border-red-100';
                    btn_text = 'ปิดบริการ';
                    btn_class = 'bg-gray-100 text-gray-400 cursor-not-allowed';
                    btn_disabled = 'disabled';
                }
                
                let icon = 'dribbble';
                if (court.sport_type === 'badminton') icon = 'activity';
                else if (court.sport_type === 'football') icon = 'circle-dot';
                else if (court.sport_type === 'tennis') icon = 'target';
                else if (court.sport_type === 'basketball') icon = 'target';
                
                const imageTag = court.image_url && court.image_url !== 'mock_image.jpg' && court.image_url !== 'default_court.jpg'
                    ? `<img src="uploads/courts/${court.image_url}" alt="${court.name}" class="w-full h-full object-cover">`
                    : `<div class="w-full h-full bg-gradient-to-br from-green-50 to-emerald-100 flex items-center justify-center text-psruGreen">
                           <i data-lucide="${icon}" class="w-14 h-14 opacity-30"></i>
                       </div>`;

                const cardHtml = `
                    <div class="court-card bg-white rounded-2xl border border-gray-200 overflow-hidden hover:shadow-md transition-shadow duration-300 flex flex-col">
                        <div class="h-44 bg-gray-100 relative overflow-hidden">
                            ${imageTag}
                            <span class="status-badge absolute top-3 right-3 ${badge_class} px-2.5 py-1 rounded-lg text-xs font-bold border">
                                ${status_text}
                            </span>
                        </div>
                        
                        <div class="p-5 flex-grow flex flex-col justify-between">
                            <div>
                                <div class="flex items-center space-x-1.5 text-xs font-medium text-gray-400 mb-1">
                                    <i data-lucide="map-pin" class="w-3 h-3"></i>
                                    <span>${court.campus_name} · ${court.location_type === 'indoor' ? 'ในร่ม' : 'กลางแจ้ง'}</span>
                                </div>
                                <h3 class="font-bold text-base text-gray-900 mb-1">${court.name}</h3>
                                <p class="text-xs text-gray-500 line-clamp-2 mb-4">${court.description}</p>
                            </div>
                            
                            <div class="pt-4 border-t border-gray-100 flex items-center justify-between">
                                <span class="inline-flex items-center text-xs text-green-700 font-semibold bg-green-50 px-2 py-1 rounded-md">
                                    <i data-lucide="sparkles" class="w-3 h-3 mr-1"></i> สิทธิ์นักศึกษา ฟรี
                                </span>
                                <button onclick="window.location.href='booking-detail.html?court_id=${court.id}&date=${document.getElementById('filter-date').value}'" ${btn_disabled} 
                                    class="action-btn ${btn_class} text-xs font-medium py-2 px-4 rounded-xl transition-all shadow-sm">
                                    ${btn_text}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });
            
            // Render Lucide icons
            lucide.createIcons();
        }

        // Search Filter submission handler
        document.getElementById('search-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const keyword = document.getElementById('search-input').value.toLowerCase().trim();
            const campusId = document.getElementById('filter-campus').value;
            const dateVal = document.getElementById('filter-date').value;
            
            let filtered = globalCourts;
            
            if (keyword) {
                filtered = filtered.filter(c => c.name.toLowerCase().includes(keyword) || c.sport_type.toLowerCase().includes(keyword));
            }
            
            if (campusId !== 'all') {
                filtered = filtered.filter(c => c.campus_id_val.toString() === campusId);
            }
            
            renderCourts(filtered);
            
            document.getElementById('grid-title').textContent = keyword 
                ? `ผลการค้นหาสำหรับ "${keyword}"` 
                : 'ตารางสนามกีฬา';
        });

        // Initialize Layout and fetch data
        window.addEventListener('DOMContentLoaded', async () => {
            await fetchCourts();
            await loadLayout();
        });
    </script>
</body>
</html>
