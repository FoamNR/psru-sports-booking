<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายการจองของฉัน - PSRU Sports</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        psruGreen: '#01a715',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Common JS Layout & Auth Controller -->
    <script src="assets/js/layout.js"></script>
</head>
<body class="bg-white text-gray-800 min-h-screen flex flex-col">

    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- 2. MAIN CONTENT -->
    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 py-10 w-full space-y-6">
        
        <!-- Header -->
        <div class="border-b border-gray-100 pb-5">
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">รายการจองสนามกีฬาของฉัน</h1>
            <p class="text-xs text-gray-400 mt-1">ติดตามสถานะคำขอ ตรวจสอบคิวเวลาเล่นกีฬา และยกเลิกสิทธิ์การจองสนาม</p>
        </div>

        <!-- tab list switchers -->
        <div class="flex border border-gray-100 bg-gray-50/50 p-1.5 rounded-2xl max-w-md text-xs font-semibold">
            <button onclick="switchTab('upcoming')" id="tab-btn-upcoming" class="flex-1 py-2.5 text-center rounded-xl bg-psruGreen text-white shadow-sm transition-all">
                กำลังจะมาถึง
            </button>
            <button onclick="switchTab('completed')" id="tab-btn-completed" class="flex-1 py-2.5 text-center rounded-xl text-gray-500 hover:text-psruGreen transition-all">
                ใช้งานแล้ว
            </button>
            <button onclick="switchTab('cancelled')" id="tab-btn-cancelled" class="flex-1 py-2.5 text-center rounded-xl text-gray-500 hover:text-psruGreen transition-all">
                ยกเลิก/ปฏิเสธ
            </button>
        </div>

        <!-- Booking Cards Container -->
        <div id="bookings-list-container" class="space-y-4">
            <!-- Dynamic loads via JS -->
            <p class="text-center text-xs text-gray-400 py-10">กำลังโหลดรายการจองของคุณ...</p>
        </div>

    </main>

    <!-- 🌐 MODAL: แสดงบัตรคิวยืนยันสิทธิ์ -->
    <div id="ticket-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center border border-gray-100 shadow-2xl relative">
            <h3 class="font-bold text-gray-900 text-base mb-1">บัตรคิวสำหรับยืนยันหน้างาน</h3>
            <p class="text-xs text-gray-400 mb-6">แสดงหน้านี้ต่อเจ้าหน้าที่ประจำสนามกีฬาเมื่อเข้าใช้งาน</p>
            
            <!-- โครงสร้างรหัสคิวสำหรับยืนยันจำลองแบบสวยหรู -->
            <div class="bg-gradient-to-br from-green-50 to-emerald-50/50 border border-green-100 rounded-2xl p-6 mb-6 mx-auto w-48 h-48 flex flex-col items-center justify-center relative shadow-inner">
                <span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-2">รหัสคิวของคุณ</span>
                <span id="m-large-code" class="text-3xl font-extrabold text-psruGreen font-mono tracking-widest"></span>
                <div class="mt-4 flex items-center text-[10px] text-green-700 font-bold bg-white border border-green-100 px-3 py-1.5 rounded-full shadow-sm">
                    <i data-lucide="ticket" class="w-3.5 h-3.5 mr-1 text-psruGreen"></i>
                    <span>ใช้ยืนยันหน้างาน</span>
                </div>
            </div>

            <div class="space-y-2 text-xs text-gray-600 mb-6 text-left border-t border-gray-100 pt-4">
                <p><span class="font-bold text-gray-800">🏟️ สนาม:</span> <span id="m-court" class="text-gray-900"></span></p>
                <p><span class="font-bold text-gray-800">⏱️ เวลา:</span> <span id="m-time" class="text-gray-900"></span></p>
                <p><span class="font-bold text-gray-800">🎫 รหัสอ้างอิง:</span> <span id="m-code" class="font-bold font-mono text-psruGreen"></span></p>
            </div>

            <button onclick="closeModal()" class="w-full bg-gray-900 hover:bg-gray-800 text-white font-bold py-2.5 rounded-xl text-xs transition-all">
                ปิดหน้าต่าง
            </button>
        </div>
    </div>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <script src="assets/js/pages/my-bookings.js"></script>
</body>
</html>
